name: Vercel Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  # Push to main -> production deployment (--prod)
  Deploy-Production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Production had no CTRLPAY_SIGNING_SECRET, which makes signed proposals
      # fail closed. Generate one once and scope it to production.
      - name: Ensure production signing secret
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          envs=$(curl -sS \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&decrypt=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          env_id=$(echo "$envs" | jq -r '[.envs[] | select(.key == "CTRLPAY_SIGNING_SECRET")][0].id // empty')
          if [ -n "$env_id" ]; then
            targets=$(echo "$envs" | jq -c '[.envs[] | select(.key == "CTRLPAY_SIGNING_SECRET")][0].target // []')
            new_targets=$(echo "$targets" | jq -c '. + ["production"] | unique')
            if [ "$targets" != "$new_targets" ]; then
              payload=$(jq -n --argjson t "$new_targets" '{target: $t}')
              curl -sS -X PATCH \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${env_id}?teamId=${VERCEL_ORG_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$payload" > /dev/null
              echo "Added production to CTRLPAY_SIGNING_SECRET targets."
            fi
          else
            secret=$(openssl rand -hex 32)
            payload=$(jq -n --arg v "$secret" '{key: "CTRLPAY_SIGNING_SECRET", value: $v, type: "encrypted", target: ["production"]}')
            curl -sS -X POST \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" > /dev/null
            echo "Created a production-scoped CTRLPAY_SIGNING_SECRET."
          fi

      # If a direct Groq key is supplied later (GitHub secret or Vercel env),
      # copy it into a production-scoped GROQ_API_KEY before pulling the build
      # environment. When absent, the app uses the existing AI Gateway key and
      # pins requests to the Groq provider. Never print the key value.
      - name: Ensure Groq key is available to Production
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          envs=$(curl -sS \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&decrypt=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          key="${GH_GROQ_KEY:-}"
          if [ -z "$key" ]; then
            key=$(echo "$envs" | jq -r '[.envs[] | select(.key | test("^GROQ"; "i")) | select(.key | test("MODEL|BASE|URL|ENDPOINT"; "i") | not) | select(.value != null and .value != "")][0].value // empty')
          fi
          if [ -z "$key" ]; then
            echo "::warning::No non-empty Groq API key found in GitHub or Vercel secrets."
            exit 0
          fi

          env_id=$(echo "$envs" | jq -r '[.envs[] | select(.key == "GROQ_API_KEY")][0].id // empty')
          if [ -n "$env_id" ]; then
            targets=$(echo "$envs" | jq -c '[.envs[] | select(.key == "GROQ_API_KEY")][0].target // []')
            new_targets=$(echo "$targets" | jq -c '. + ["production"] | unique')
            payload=$(jq -n --arg v "$key" --argjson t "$new_targets" '{value: $v, target: $t}')
            curl -sS -X PATCH \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${env_id}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" > /dev/null
            echo "Updated GROQ_API_KEY targets to include production."
          else
            payload=$(jq -n --arg v "$key" '{key: "GROQ_API_KEY", value: $v, type: "encrypted", target: ["production"]}')
            curl -sS -X POST \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" > /dev/null
            echo "Created a production-scoped GROQ_API_KEY from the existing Vercel Groq value."
          fi

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Judges must be able to open the production URL without a Vercel login.
      # Keep preview deployments protected, but expose production. Non-fatal so
      # a token without project-settings permission cannot block the deploy.
      - name: Make the production demo publicly reachable
        continue-on-error: true
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":{"deploymentType":"preview"},"passwordProtection":null}')
          echo "$response"

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+' deploy.log | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Deployment Record
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              environment: 'Production',
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
              description: 'Vercel CLI deployment via GitHub Actions'
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: res.data.id,
              state: 'success',
              ...(process.env.DEPLOY_URL ? { environment_url: process.env.DEPLOY_URL } : {}),
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: 'Deployed by GitHub Actions (Vercel CLI)'
            });
            core.info(`Deployment record #${res.data.id} marked success${process.env.DEPLOY_URL ? ' -> ' + process.env.DEPLOY_URL : ''}`);

  # Pull request opened/updated against main -> preview deployment
  # (Secrets are unavailable to fork PRs unless a maintainer approves the run;
  #  same-repo branch PRs work out of the box.)
  Deploy-Preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+' deploy.log | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Deployment Record
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              environment: 'Preview',
              required_contexts: [],
              auto_merge: false,
              description: 'Vercel CLI preview via GitHub Actions'
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: res.data.id,
              state: 'success',
              ...(process.env.DEPLOY_URL ? { environment_url: process.env.DEPLOY_URL } : {}),
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: 'Deployed by GitHub Actions (Vercel CLI)'
            });
            core.info(`Deployment record #${res.data.id} marked success${process.env.DEPLOY_URL ? ' -> ' + process.env.DEPLOY_URL : ''}`);
