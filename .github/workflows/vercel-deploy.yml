name: Vercel Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  # Push to main -> production deployment (--prod)
  Deploy-Production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Judges must be able to open the production URL without a Vercel login.
      # Keep preview deployments protected, but expose production. Non-fatal so
      # a token without project-settings permission cannot block the deploy.
      - name: Make the production demo publicly reachable
        continue-on-error: true
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":{"deploymentType":"preview"},"passwordProtection":null}')
          echo "$response"

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+' deploy.log | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Deployment Record
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              environment: 'Production',
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
              description: 'Vercel CLI deployment via GitHub Actions'
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: res.data.id,
              state: 'success',
              ...(process.env.DEPLOY_URL ? { environment_url: process.env.DEPLOY_URL } : {}),
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: 'Deployed by GitHub Actions (Vercel CLI)'
            });
            core.info(`Deployment record #${res.data.id} marked success${process.env.DEPLOY_URL ? ' -> ' + process.env.DEPLOY_URL : ''}`);

  # Pull request opened/updated against main -> preview deployment
  # (Secrets are unavailable to fork PRs unless a maintainer approves the run;
  #  same-repo branch PRs work out of the box.)
  Deploy-Preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+' deploy.log | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Deployment Record
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              environment: 'Preview',
              required_contexts: [],
              auto_merge: false,
              description: 'Vercel CLI preview via GitHub Actions'
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: res.data.id,
              state: 'success',
              ...(process.env.DEPLOY_URL ? { environment_url: process.env.DEPLOY_URL } : {}),
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: 'Deployed by GitHub Actions (Vercel CLI)'
            });
            core.info(`Deployment record #${res.data.id} marked success${process.env.DEPLOY_URL ? ' -> ' + process.env.DEPLOY_URL : ''}`);
